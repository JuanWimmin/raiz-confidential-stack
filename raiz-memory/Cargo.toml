[package]
name = "raiz-memory"
version = "0.1.0"
edition = "2021"
description = "Durable event index for private wallets on Stellar (CT + SPP). Indexes ciphertext beyond the RPC's 7-day retention window."
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
